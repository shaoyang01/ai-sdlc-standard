# Compact Execution Capsule v1 — Template
#
# 合同：ai-sdlc/compact-prompt-standard.md（PCE-01-A）
# 本文件是固定形状模板；实例必须满足 1.2/1.3 节全部值规则。
# 一个 Capsule 只能表达一个目标；不接受自由 shell command。
# 加载方式：YAML.safe_load(permitted_classes: [], aliases: false)。

task_id: "<task-id>"
prompt_mode: "<MICRO_FIX|SESSION_CONTINUATION|BOOTSTRAP|RECOVERY>"

routing:
  recipient: "<recipient>"
  paste_location: "<paste-location>"
  report_back_to: "<report-back-to>"
  next_hop_after_report: "<next-hop-after-report>"

baseline:
  repository: "<owner/name>"
  branch: "<fact-branch>"
  head: "<40-char-lowercase-hex-sha>"
  pull_request: "<none|PR-number>"

objective: "<single-objective>"

delta:
  open_findings:
    - id: "<finding-id>"
      status: OPEN
  required_changes:
    - "<repository-relative-path>"
    # zero-repository-delta（PCE_01_PR_ONLY_ZERO_DELTA_F01）：
    # required_changes: [] 仅当 allowed_files: [] 且
    # maximum_changed_files: 0 同时成立；不得带非空 scope 或正 max。
  acceptance_criteria:
    - "<acceptance-criterion>"
  preserved_closed_findings:
    - id: "<finding-id>"
      status: CLOSED

scope:
  allowed_files:
    - "<repository-relative-path>"
  maximum_changed_files: <nonnegative-integer>
  # zero-repository-delta 形状必须为 allowed_files: [] 与
  # maximum_changed_files: 0；其他形状保持非空与正整数。

validation_profile: "<DOC_ONLY|TYPE_ONLY|LOCAL_BEHAVIOR|PERSISTENCE_CONCURRENCY|GLOBAL_CONTRACT>"

git:
  commit_count: <0|1>
  commit_message: "<commit-message>"
  push_mode: "<NONE|NORMAL_PUSH>"
  pull_request_action: "<NONE|CREATE_DRAFT|UPDATE_DRAFT>"
  # zero-repository-delta 支持 commit_count: 0、push_mode: NONE，且
  # pull_request_action 为 CREATE_DRAFT（带 pr_head）或 NONE（无 pr_head，
  # PCE_01_GENERIC_ZERO_DELTA_NO_PR_G01）。

# canonical exact PR-head identity（PCE_01_PR_ONLY_ZERO_DELTA_F01）：
# 仅 zero-repository-delta + CREATE_DRAFT 必填；zero-repository-delta +
# NONE（PCE_01_GENERIC_ZERO_DELTA_NO_PR_G01）与非零 delta 禁止携带。
# branch 为 PR head 分支名；sha 为 40 位小写十六进制（须以字符串提供，
# 纯数字 sha 必须加引号，否则会被 YAML 解析为整数）。
pr_head:
  branch: "<pr-head-branch>"
  sha: "<40-char-lowercase-hex-sha>"

# bounded exact result handoff（PCE_01_BOUNDED_EXACT_RESULT_HANDOFF_G02）：
# 可选单一 result_handoff 契约；省略时输出与现有 capsule byte-identical。
# identity 为稳定 producer/consumer 标识；maximum_bytes 为有限字节上界；
# required 标记结果是否必须；payload 为完整 frozen 字节（不得以 hash/
# 摘要代替，不得要求重建；payload 字节数不得超过 maximum_bytes）。
# result_handoff:
#   identity: "<stable-identity>"
#   maximum_bytes: <positive-integer>
#   required: <true|false>
#   payload: "<exact-frozen-payload>"

forbidden_actions:
  - "<forbidden-action>"

completion_report:
  recipient: "<completion-report-recipient>"
  name: "<completion-report-name>"
  maximum_lines: <positive-integer>
  stop_after_report: true
