name: delta-change-supplement
description: Synthetic delta change routing / supplement requirement path parity fixture.
project_type_profiles: []
required_standard_files:
  - skills/sdlc-requirement-normalizer/references/intake-workflow.md
  - skills/sdlc-solution-reviewer/references/development-path-decision.md
  - skill-contracts/known-skills/sdlc-requirement-normalizer.md
  - ai-sdlc/change-control.md
  - ai-sdlc/complexity-routing.md
required_terms:
  - Requirement Supplement
  - Specification Missing
  - Same Requirement Decision
  - Parent Requirement ID
  - New Requirement Needed
  - Aggregate Requirement Scope
  - Current Change Scope / Delta Scope
  - Original Implemented / Approved Scope
  - Out of Delta Scope
  - "Decision Scope: DELTA_CHANGE"
  - Delta Complexity
  - "Aggregate Complexity: reference only"
  - Ignored Aggregate Triggers
  - Development Path Decision must be based on Delta Scope
  - Do not route by aggregate complexity for requirement supplements
  - default to DIRECT_IMPLEMENTATION
  - "`SPECKIT_PIPELINE_REQUIRED` only when the delta itself is complex"
  - use BLOCKED_NEEDS_REVISION
forbidden_terms:
  - .specify/memory/**
  - .specify/workflow/**
  - .specify/coding_guide/**
  - filename-versioned artifacts
  - aggregate scope triggers SPECKIT_PIPELINE_REQUIRED
expected_outputs:
  - Intake Classification with Specification Missing
  - Supplement routing fields
  - Delta Development Path Decision
notes: development-time fixture; not target project runtime input
