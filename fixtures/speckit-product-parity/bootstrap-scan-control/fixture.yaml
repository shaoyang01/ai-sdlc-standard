name: bootstrap-scan-control
description: Synthetic bootstrap performance / large repo scan control parity fixture.
project_type_profiles: []
required_standard_files:
  - scripts/bootstrap-speckit-project.sh
  - scripts/validate-skill-contracts.rb
  - docs/SPECKIT_BOOTSTRAP.md
required_terms:
  - --scan-root
  - --include-root
  - --scan-timeout
  - --max-samples
  - bounded file inventory
  - scan_duration_seconds
  - timeout_occurred
  - partial_scan
  - TIMEOUT / PARTIAL
  - scan_roots
  - include_roots
  - effective_scan_roots
  - exclude_patterns
  - android/build
  - ios/build
  - node_modules
  - large-fixtures
  - __snapshots__
  - mock-data
  - relative path
  - file type
  - matched include root
  - included reason
  - must not be treated as a complete
forbidden_terms:
  - .specify/memory/**
  - .specify/workflow/**
  - .specify/coding_guide/**
  - filename-versioned artifacts
expected_outputs:
  - scan_control section in governance profile
  - structured file inventory table
notes: development-time fixture; not target project runtime input
