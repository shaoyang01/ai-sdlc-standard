# Compact Prompt Contract Fixtures (validation-only)
#
# authority=validation_only
# runtime_authority=false
# implementation_authority=false
# merge_authority=false
# publication_authority=false
#
# This fixture is a development-time conformance oracle for the PCE-01-A
# Compact Prompt Contract. It is not a prompt renderer, not a project profile
# resolver, not a command executor, and not an owner of any execution fact.
# No fixture executes commands, writes files, or touches the network.
#
# Each fixture's `capsule` is the verbatim raw YAML text of a capsule. The
# validator parses and classifies that text itself, so parse-level defects
# (duplicate keys, aliases, anchors, tags, merge keys, null) can be expressed
# faithfully. Every negative fixture declares the exact expected
# classification so the validator can prove it fails for the intended reason.
#
# No fixture contains real secrets, private knowledge-base content, full
# historical prompts, or executable shell commands.

schema_version: compact-prompt-contracts-v1
authority: validation_only

fixtures:
  - id: CAPSULE-VALID-MICRO-FIX
    category: valid
    description: "Valid MICRO_FIX capsule with a code change and LOCAL_BEHAVIOR profile"
