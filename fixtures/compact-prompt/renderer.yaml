# Compact Prompt Renderer Fixtures (validation-only)
#
# authority=validation_only
# runtime_authority=false
# implementation_authority=false
# merge_authority=false
# publication_authority=false
#
# These fixtures exercise the PCE-01-B CLI service
# (scripts/ai-sdlc-prompt.rb + scripts/lib/compact_prompt.rb) with injected
# synthetic git state and in-memory capsule/policy/template text. No
# filesystem writes, no shell, no network, no real remote access.
#
# `default_policy` is the standard-library project policy used unless a
# fixture provides its own `policy`. `git_state` supplies the synthetic
# checkout-independent named-ref state. `template` overrides the repository
# prompt template asset (used to prove template contract-manifest
# violations fail closed). `yaml_blocks` declares parsed-field
# expectations against the single canonical v2 envelope document;
# `omitted_keys` lists top-level keys that must be absent.
#
# Expected contract:
#   - validate success: stdout exactly "compact execution capsule valid\n",
#     stderr empty, exit 0
#   - compile success: stdout is exactly one canonical
#     compact-execution-envelope-v2 YAML document — valid UTF-8, no CR,
#     single trailing LF, exactly one delivery_type identity, no legacy
#     ten-section headings, no placeholder-like / marker-like text,
#     byte-identical on repeated runs, exit 0
#   - any failure: stdout empty, stderr only stable diagnostics, exit per
#     the CLI contract (2 CLI_OR_INPUT, 3 CONTRACT_OR_POLICY,
#     4 GIT_BASELINE, 5 RENDER_OR_BUDGET)

schema_version: compact-prompt-renderer-fixtures-v1
authority: validation_only

default_policy: |
  schema: compact-prompt-project-policy-v1
  project_id: fixture-project
  repository: acme/widgets
  fact_branch: feature/runtime-v1
  commands:
    LIB_SYNTAX: {argv: [ruby, -c, scripts/lib/compact_prompt.rb]}
    CLI_SYNTAX: {argv: [ruby, -c, scripts/ai-sdlc-prompt.rb]}
    VALIDATOR_SYNTAX: {argv: [ruby, -c, scripts/validate-compact-prompt-contracts.rb]}
    COMPACT_CONTRACTS: {argv: [ruby, scripts/validate-compact-prompt-contracts.rb]}
    SKILL_CONTRACTS: {argv: [ruby, scripts/validate-skill-contracts.rb]}
    CAPABILITY_METADATA: {argv: [ruby, scripts/validate-capability-metadata-chain.rb]}
    TYPECHECK: {argv: [npm, run, typecheck]}
    ROOT_NPM_TEST: {argv: [npm, test]}
    LOOP_MUTATIONS: {argv: [npm, run, "test:loop-patch-mutations"]}
    GIT_DIFF_CHECK: {argv: [git, diff, --check]}
  validation_profiles:
    DOC_ONLY:
      required_command_ids: [SKILL_CONTRACTS, CAPABILITY_METADATA, GIT_DIFF_CHECK]
      forbidden_command_ids: [ROOT_NPM_TEST, LOOP_MUTATIONS]
    TYPE_ONLY:
      required_command_ids: [TYPECHECK, GIT_DIFF_CHECK]
      forbidden_command_ids: [ROOT_NPM_TEST, LOOP_MUTATIONS]
    LOCAL_BEHAVIOR:
      required_command_ids:
        - LIB_SYNTAX
        - CLI_SYNTAX
        - VALIDATOR_SYNTAX
        - COMPACT_CONTRACTS
        - SKILL_CONTRACTS
        - CAPABILITY_METADATA
        - GIT_DIFF_CHECK
      forbidden_command_ids: [ROOT_NPM_TEST, LOOP_MUTATIONS]
    PERSISTENCE_CONCURRENCY:
      required_command_ids: [ROOT_NPM_TEST, LOOP_MUTATIONS, GIT_DIFF_CHECK]
      forbidden_command_ids: []
    GLOBAL_CONTRACT:
      required_command_ids:
        - LIB_SYNTAX
        - CLI_SYNTAX
        - VALIDATOR_SYNTAX
        - COMPACT_CONTRACTS
        - SKILL_CONTRACTS
        - CAPABILITY_METADATA
        - TYPECHECK
        - ROOT_NPM_TEST
        - LOOP_MUTATIONS
        - GIT_DIFF_CHECK
      forbidden_command_ids: []

