# Gate Runner Scenario Conformance Fixture (validation-only)
#
# authority=validation_only
# runtime_authority=false
# gate_decision_authority=false
# implementation_authority=false
# merge_authority=false
# publication_authority=false
#
# This fixture is a standard-package development-time conformance oracle. It is
# not sdlc-gate-runner, not a formal Gate artifact, not a target project
# runtime input, and not the owner of Manifest / Sync / Reconcile / D09
# semantics. No scenario creates real Gate, review, merge, or publication
# facts, and no scenario writes the real manifest or library/**.
#
# Loaded with YAML.safe_load(permitted_classes: [], aliases: false): YAML
# aliases and object deserialization are rejected. canonical_sources must be
# safe repository-relative regular files.
#
# Expected outcomes are asserted by scripts/validate-gate-runner-scenarios.rb
# which computes the actual outcome independently and deep-compares every
# expected field.

