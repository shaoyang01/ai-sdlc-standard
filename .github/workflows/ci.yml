name: CI

on:
  push:
    branches:
      - feature/loop-runtime-v1
  pull_request:
    branches:
      - feature/loop-runtime-v1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: ci-typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a  # v4.2.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run typecheck

  tests:
    name: ci-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a  # v4.2.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # The auto-discovering parallel runner (scripts/run-tests-parallel.mjs)
      # enumerates tests/*.test.ts, including the WP3.5-C cutover tests; no
      # per-file steps are pinned here.
      - run: npm test

  standards:
    name: ci-standards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@a6e6f86333f0a2523ece813039b8b4be04560854  # v1.190.0
        with:
          ruby-version: '3.3'

      - run: ruby --version

      - run: ruby scripts/validate-skill-contracts.rb

      - run: ruby scripts/validate-product-parity-fixtures.rb

      - run: ruby scripts/validate-capability-metadata-chain.rb

      - run: ruby scripts/validate-gate-runner-scenarios.rb

      - run: ruby -c scripts/lib/compact_prompt.rb

      - run: ruby -c scripts/ai-sdlc-prompt.rb

      - run: ruby -c scripts/validate-compact-prompt-contracts.rb

      - run: ruby scripts/validate-compact-prompt-contracts.rb

  loop-patch-mutations:
    name: ci-loop-patch-mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a  # v4.2.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run test:loop-patch-mutations
